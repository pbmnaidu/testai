services:
  - type: web
    name: mplads-backend
    env: python
    # Free tier: local uploaded files are temporary.
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.backend.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MPLADS_AUTOMATION_ENABLED
        value: "false"
  - type: web
    runtime: static
    name: mplads-frontend
    buildCommand: "cd frontend && npm ci --legacy-peer-deps && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mplads-backend-yf3v.onrender.com/api
