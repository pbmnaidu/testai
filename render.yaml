services:
  - type: web
    name: mplads-backend
    env: python
    # Free tier: local uploaded files are temporary.
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.backend.app:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
  - type: web
    runtime: static
    name: mplads-frontend
    buildCommand: "cd frontend && npm ci --legacy-peer-deps && npm run build"
    staticPublishPath: frontend/dist
