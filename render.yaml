# ==============================================================================
# DEPRECATED: Render deployment configuration
# ==============================================================================
# NOTICE: The MPLADS Risk Intelligence platform has migrated away from Render
# to a serverless static architecture:
#   - Frontend & static snapshots: Vercel CDN
#   - Automated analysis pipeline: GitHub Actions (.github/workflows/pipeline_deploy.yml)
#   - Evidence uploads & metadata: Firebase Storage & Firestore
#
# DO NOT deploy or maintain active services on Render. Render backend services
# should be suspended or deleted in the Render Dashboard to avoid unnecessary costs.
#
# The legacy configuration below is retained solely for historical audit reference.
# ==============================================================================

services:
  - type: web
    name: mplads-backend-DEPRECATED
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.backend.app:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MPLADS_AUTOMATION_ENABLED
        value: "false"
  - type: web
    runtime: static
    name: mplads-frontend-DEPRECATED
    buildCommand: "cd frontend && npm ci --legacy-peer-deps && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mplads-backend-yf3v.onrender.com/api
