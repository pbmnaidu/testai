name: Automated ML Pipeline & Cloud Deployment

on:
  workflow_dispatch: # Allows 1-click manual trigger from GitHub website
  schedule:
    - cron: '0 2 * * 0' # Automatically runs every Sunday at 2:00 AM UTC
  push:
    branches:
      - frontend-ui-migration
      - chatBot
    paths:
      - 'data/processed/**'
      - 'src/modules/**'
      - 'src/risk/**'
      - 'src/run_pipeline.py'
      - 'src/data/export_snapshots.py'
      - 'src/data/validate_snapshots.py'

concurrency:
  group: pipeline-deploy
  cancel-in-progress: false

jobs:
  run-pipeline-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows pushing updated model files and snapshots back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: frontend-ui-migration # Deploy to production branch (Vercel tracks this)
          fetch-depth: 0 # Give the reconciliation step the full branch history

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Sync & Full ML Pipeline
        run: |
          python scripts/auto_sync_pipeline.py

      - name: Rebase generated changes onto latest frontend-ui-migration
        run: |
          # git-auto-commit-action intentionally does not pull before pushing.
          # Reconcile a commit from an earlier/parallel run while the generated
          # files are still uncommitted.
          git fetch origin frontend-ui-migration
          git rebase --autostash origin/frontend-ui-migration

      - name: Commit and Push Updated Scored Datasets & Validated Snapshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: frontend-ui-migration
          commit_message: "Automated ML Pipeline: update precomputed features, risk scores, and dashboard snapshots [skip ci]"
          # data/snapshots/ is an ignored local mirror. The deployable snapshot
          # lives under frontend/public and is tracked by Git.
          file_pattern: "data/features/*.parquet data/processed/*.parquet frontend/public/data/snapshots/**"
